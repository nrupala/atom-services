# HAND-BUILT: built out in full for release slot #1. The generator never overwrites this file.
service_name: release-readiness-verdict
display_name: Release-readiness verdict
tier: A
status: built-locally
atom_version: 0.1.0
queue_position: 1
sources:
- knowledge-atom:#13
binding:
  skill: release-management
  skill_path: workspace/mymilo-build/skills/release-management/SKILL.md
  skill_version: '1'
  rule: R1 — fixes land in the skill first; the atom re-deploys from the refined
    skill and must pass regression before its version bumps. A skill refinement
    marks this atom stale until re-verified.
deliverable_type: VERDICT
endpoints:
- API
- MCP
- agent
- human
implementation:
  language: Python 3 (stdlib only)
  entry: src/release_readiness.py — evaluate(manifest) -> verdict dict; CLI prints JSON + stamp
  keys_reference: src/keys.py — per-atom HMAC key derivation/verification
  tests: tests/test_release_readiness.py — 16 tests, all passing 2026-11-15
  benchmark: src/bench.py
keys:
  namespace: release_readiness_verdict
  prefix: atm_1_release_readiness_verdict_
  issuance: Per user, per atom. Self-serve — sign up, open this atom, issue key.
    Key = HMAC-SHA256(master_secret, email | atom_service | issued_at),
    version-prefixed; regenerated on demand after the user authenticates, never
    stored (record holds email, atom, issued_at, fingerprint).
  scope: This atom only. A key for one atom never verifies for another.
rate_limit:
  per_key_per_minute: 60
  per_key_per_day: 10000
  status: SPEC default — the per-key rate limit is the capacity guard for open
    public usage; tuned at build-out from measured production cost.
pricing:
  unit: call
  rate: null
  rate_status: pending
  measured_cost:
    verdict_ms_per_call: 0.1166
    key_derivation_ms_per_call: 0.0122
    llm_tokens_per_call: 0
    network_calls_per_call: 0
    measured: 2026-11-15, src/bench.py, 20000 iterations, build VM (shared vCPU)
    note: Marginal compute ~zero; hosted marginal cost adds the serving
      platform's per-request charge, unmeasurable until deployment. Prompt-rate
      fallback = $0 (zero tokens), so steps 1 and 3 produce no rate. Step 2
      (consensus) ran 2026-11-15 — Gemini $0.0005/call, DeepSeek $0.01/call,
      OpenAI lane blocked (named in reviews/openai-review-STATUS.md) — two
      inputs 20x apart, third missing = no consensus. Rate stays pending;
      recorded input range $0.0005-$0.01/call. See reviews/README.md.
  protocol: rails/billing.md — measured cost first, then three-model consensus,
    then prompt-rate fallback. Same rate on Conduit as everywhere; no channel markup.
self_use:
  verdict: pass
  workflow: Release gates run on every product
qualification_tests:
  T1_bounded: true
  T2_servable: true
  T3_no_private_substrate: true
  T4_measurable_cost: true
  T5_pays_per_use: true
  T6_safe_to_expose: true
internal_caller: Wright — zero price, metered to the internal cost ledger (R2).
