    = HMAC-SHA256(master_secret, email | atom_service | issued_at), version-prefixed;
    regenerated on demand after the user authenticates, never stored (record holds
    email, atom, issued_at, fingerprint).'
  scope: This atom only. A key for one atom never verifies for another.
rate_limit:
  per_key_per_minute: 60
  per_key_per_day: 10000
  status: "SPEC default \u2014 the per-key rate limit is the capacity guard for open\
    \ public usage; tuned per atom at build-out from measured production cost."
pricing:
  unit: deliverable
  rate: null
  rate_status: pending
  protocol: "rails/billing.md \u2014 measured cost first, then three-model consensus,\
    \ then prompt-rate fallback. Same rate on Conduit as everywhere; no channel markup."
self_use:
  verdict: pass
  workflow: Designing product interfaces before build
qualification_tests:
  T1_bounded: true
  T2_servable: true
  T3_no_private_substrate: true
  T4_measurable_cost: true
  T5_pays_per_use: false
  T6_safe_to_expose: true
internal_caller: "Wright \u2014 zero price, metered to the internal cost ledger (R2)."
