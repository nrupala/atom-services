sources:
- skill:ux-ui-design
binding:
  skill: ux-ui-design
  skill_path: workspace/mymilo-build/skills/ux-ui-design/SKILL.md
  skill_version: '1'
  rule: "R1 \u2014 fixes land in the skill first; the atom re-deploys from the refined\
    \ skill and must pass regression before its version bumps. A skill refinement\
    \ marks this atom stale until re-verified."
deliverable_type: DELIVERABLE
endpoints:
- agent
keys:
  namespace: ux_flow_component_spec_pack
  prefix: atm_1_ux_flow_component_spec_pack_
