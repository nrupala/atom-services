service_name: applied-ml-validation
display_name: Applied ml validation
tier: B
status: built-locally
atom_version: 0.1.0
sources:
- skill:applied-machine-learning
binding:
  skill: applied-machine-learning
  skill_path: workspace/mymilo-build/skills/applied-machine-learning/SKILL.md
  skill_version: '1'
  rule: "R1 \u2014 fixes land in the skill first; the atom re-deploys from the refined\
    \ skill and must pass regression before its version bumps. A skill refinement\
    \ marks this atom stale until re-verified."
deliverable_type: VALIDATION
endpoints:
- agent
- human
implementation:
  language: Python 3 (stdlib only)
  entry: src/applied_ml_validation.py — evaluate(manifest) -> verdict dict; CLI prints JSON + stamp
  tests: tests/test_applied_ml_validation.py — 46 tests, all passing 2026-11-15
keys:
  namespace: applied_ml_validation
  prefix: atm_1_applied_ml_validation_
  issuance: 'Per user, per atom. Self-serve: sign up, open this atom, issue key. Key
    = HMAC-SHA256(master_secret, email | atom_service | issued_at), version-prefixed;
    regenerated on demand after the user authenticates, never stored (record holds
    email, atom, issued_at, fingerprint).'
  scope: This atom only. A key for one atom never verifies for another.
rate_limit:
  per_key_per_minute: 60
  per_key_per_day: 10000
  status: "SPEC default \u2014 the per-key rate limit is the capacity guard for open\
    \ public usage; tuned per atom at build-out from measured production cost."
pricing:
  unit: deliverable
  rate: null
  rate_status: pending
  protocol: "rails/billing.md \u2014 measured cost first, then three-model consensus,\
    \ then prompt-rate fallback. Same rate on Conduit as everywhere; no channel markup."
self_use:
  verdict: pass
  workflow: Model evaluation for products
qualification_tests:
  T1_bounded: true
  T2_servable: true
  T3_no_private_substrate: true
  T4_measurable_cost: true
  T5_pays_per_use: false
  T6_safe_to_expose: true
internal_caller: "Wright \u2014 zero price, metered to the internal cost ledger (R2)."
